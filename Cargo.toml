[workspace]
members = ["core", "ui", "app"]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2024"

[workspace.dependencies]
arboard = "3.4.1"
get_if_addrs = "0.5.3"
iced = { version = "0.14", features = ["tokio"] }
ron = "0.12.0"
serde = { version = "1.0.210", features = ["derive"] }
snmp2 = { version = "0.5.0", features = ["tokio"] }
thiserror = "2.0.11"
time = { version = "0.3.37", features = ["local-offset"] }
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
